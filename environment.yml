# 源码开发环境：包含仿真运行、协议生成与 pytest，不包含 Notebook 分析依赖。
name: slope-sim
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pybullet
  - numpy
  - matplotlib
  - pandas
  - pyyaml
  - pyside6
  - mcap
  - pyqtgraph
  - pyopengl
  - pyserial
  - packaging=26.2
  - pip
  - pytest
  - pip:
      - grpcio-tools==1.76.0
      - protobuf==6.33.6
      - eclipse-ecal==6.1.1
