# Conda 仿真环境依赖配置。
name: slope-sim
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pybullet
  - numpy
  - matplotlib
  - pandas
  - scipy
  - pyyaml
  - pyside6
  - mcap
  - pyqtgraph
  - pyopengl
  - protobuf=6.33.6
  - grpcio-tools=1.76.0
  - packaging=26.2
  - pip
  - pytest
  - jupyterlab
  - ipykernel
  - pip:
      - eclipse-ecal==6.1.1
