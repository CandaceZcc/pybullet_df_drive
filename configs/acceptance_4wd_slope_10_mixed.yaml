# 人工验收预置场景：四轮主动转向车、8 度坡面、5 静态 + 5 移动障碍物。
schema_version: 1
robot:
  model: active_steering_4wd
terrain:
  terrain_model: slope
  slope_deg: 8.0
  golf_seed: 0
  golf_relief: medium
obstacles:
  - logical_id: 1
    mode: static
    geometry: {shape: box, half_extents: [0.25, 0.25, 0.45]}
    position: [-3.0, -1.4, 0.45]
    orientation: [0.0, 0.0, 0.0, 1.0]
    path: null
  - logical_id: 2
    mode: static
    geometry: {shape: cylinder, half_extents: [0.25, 0.25, 0.45]}
    position: [-2.0, 1.3, 0.45]
    orientation: [0.0, 0.0, 0.0, 1.0]
    path: null
  - logical_id: 3
    mode: static
    geometry: {shape: sphere, half_extents: [0.45, 0.45, 0.45]}
    position: [-0.8, -1.6, 0.45]
    orientation: [0.0, 0.0, 0.0, 1.0]
    path: null
  - logical_id: 4
    mode: static
    geometry: {shape: box, half_extents: [0.25, 0.25, 0.45]}
    position: [0.8, 1.5, 0.45]
    orientation: [0.0, 0.0, 0.0, 1.0]
    path: null
  - logical_id: 5
    mode: static
    geometry: {shape: cylinder, half_extents: [0.25, 0.25, 0.45]}
    position: [2.0, -1.3, 0.45]
    orientation: [0.0, 0.0, 0.0, 1.0]
    path: null
  - logical_id: 6
    mode: moving
    geometry: {shape: box, half_extents: [0.22, 0.22, 0.4]}
    position: [-2.6, 0.2, 0.4]
    orientation: [0.0, 0.0, 0.0, 1.0]
    path: {start_xy: [-2.6, 0.2], end_xy: [-1.2, 0.2], speed: 0.35, progress: 0.0, direction: 1}
  - logical_id: 7
    mode: moving
    geometry: {shape: cylinder, half_extents: [0.22, 0.22, 0.4]}
    position: [-1.4, -0.4, 0.4]
    orientation: [0.0, 0.0, 0.0, 1.0]
    path: {start_xy: [-1.4, -0.4], end_xy: [0.2, -0.4], speed: 0.35, progress: 0.0, direction: 1}
  - logical_id: 8
    mode: moving
    geometry: {shape: sphere, half_extents: [0.4, 0.4, 0.4]}
    position: [0.0, 0.5, 0.4]
    orientation: [0.0, 0.0, 0.0, 1.0]
    path: {start_xy: [0.0, 0.5], end_xy: [1.4, 0.5], speed: 0.35, progress: 0.0, direction: 1}
  - logical_id: 9
    mode: moving
    geometry: {shape: box, half_extents: [0.22, 0.22, 0.4]}
    position: [1.2, -0.5, 0.4]
    orientation: [0.0, 0.0, 0.0, 1.0]
    path: {start_xy: [1.2, -0.5], end_xy: [2.6, -0.5], speed: 0.35, progress: 0.0, direction: 1}
  - logical_id: 10
    mode: moving
    geometry: {shape: cylinder, half_extents: [0.22, 0.22, 0.4]}
    position: [2.2, 0.2, 0.4]
    orientation: [0.0, 0.0, 0.0, 1.0]
    path: {start_xy: [2.2, 0.2], end_xy: [3.6, 0.2], speed: 0.35, progress: 0.0, direction: 1}
sensors:
  lidar_front:
    parent_link: lidar_front_mount
    position: [0.0, 0.0, 0.0]
    orientation: [0.0, 0.0, 0.0, 1.0]
  lidar_rear:
    parent_link: lidar_rear_mount
    position: [0.0, 0.0, 0.0]
    orientation: [0.0, 0.0, 1.0, 0.0]
  rtk_primary:
    parent_link: base_link
    position: [-0.2, 0.0, 0.18]
    orientation: [0.0, 0.0, 0.0, 1.0]
  rtk_secondary:
    parent_link: base_link
    position: [0.2, 0.0, 0.18]
    orientation: [0.0, 0.0, 0.0, 1.0]
  imu:
    parent_link: base_link
    position: [0.0, 0.0, 0.08]
    orientation: [0.0, 0.0, 0.0, 1.0]
  lidar:
    vertical_lines: 16
    horizontal_samples: 180
    horizontal_fov_deg: 180.0
    vertical_fov_deg: [-15.0, 15.0]
    min_range_m: 0.1
    max_range_m: 45.0
