camera_target: [0.8, 0.0, 0.0]
camera_follow_enabled: true
camera_follow_view: front
lidar_enabled: true
lidar_ray_count: 31
lidar_max_distance: 5.0
lidar_fov_deg: 180.0
lidar_debug_draw: false
terrain_model: flat
golf_seed: 0
golf_relief: medium
ground_lateral_friction: 1.0
ground_rolling_friction: 0.02
ground_spinning_friction: 0.0
drive_lateral_friction: 2.0
support_lateral_friction: 0.03
log_dir: results/logs
figure_dir: results/figures
