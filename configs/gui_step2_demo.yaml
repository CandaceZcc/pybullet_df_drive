# 阶段一 GUI 演示配置：使用后置差速车、物理驱动和实时 Dashboard。
mode: gui
slope_deg: 0.0
duration_sec: 5.0
time_step: 0.004166666666666667
target_linear_velocity: 0.35
target_angular_velocity: 0.0
robot_model: df_back
drive_model: physics
dashboard_enabled: true
dashboard_update_hz: 5.0
dashboard_smoothing_alpha: 0.25
camera_distance: 6.0
camera_yaw: 45.0
