# 阶段一高尔夫起伏 GUI 配置：用于观察主动转向车和连续起伏地形。
mode: gui
slope_deg: 0.0
duration_sec: 3.0
time_step: 0.004166666666666667
target_linear_velocity: 0.25
target_angular_velocity: 0.0
robot_model: active_steering_4wd
drive_model: physics
terrain_model: golf_heightfield
golf_seed: 41
golf_relief: medium
dashboard_enabled: true
dashboard_update_hz: 5.0
dashboard_smoothing_alpha: 0.25
dashboard_plot_update_hz: 5.0
dashboard_plot_window_sec: 20.0
manual_linear_acceleration_limit: 1.5
manual_angular_acceleration_limit: 4.0
camera_distance: 6.0
camera_yaw: 45.0
camera_pitch: -35.0
camera_target: [1.0, 0.0, 0.2]
camera_follow_enabled: true
camera_follow_view: front
lidar_enabled: true
lidar_ray_count: 31
lidar_max_distance: 5.0
lidar_fov_deg: 180.0
lidar_debug_draw: false
ground_lateral_friction: 0.8
ground_rolling_friction: 0.02
ground_spinning_friction: 0.0
drive_lateral_friction: 2.0
support_lateral_friction: 0.03
drive_motor_force: 5.0
log_dir: results/logs
figure_dir: results/figures
